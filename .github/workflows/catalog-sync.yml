name: Catalog sync

# Runs the private holybackend pipeline. The code is fetched at run time with a
# read-only token and is never stored in this repository.
# SECURITY: never add pull_request/pull_request_target triggers, artifact uploads,
# caches, or steps that print files or environment variables. Logs are public.

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 02:00, 08:00, 14:00, and 20:00 Asia/Kolkata.
    - cron: "30 2,8,14,20 * * *"

permissions: {}

concurrency:
  group: holybackend-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch private code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ayaanmotiwala/holybackend
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Restore environment
        shell: bash
        env:
          HOLYBACKEND_ENV: ${{ secrets.HOLYBACKEND_ENV }}
        run: |
          if [ -z "$HOLYBACKEND_ENV" ]; then echo "HOLYBACKEND_ENV secret is missing" >&2; exit 1; fi
          printf '%s\n' "$HOLYBACKEND_ENV" > .env
          chmod 600 .env

      - name: Install
        run: python -m pip install -q . > /dev/null 2>&1 || { echo "Install failed" >&2; exit 1; }

      - name: Run pipeline (output hidden)
        run: python -m apps.worker.scheduled_runner > /dev/null 2>&1 || { echo "Pipeline failed; see scrape_runs in Supabase/admin" >&2; exit 1; }
