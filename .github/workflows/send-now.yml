# Bulk send (install as .github/workflows/send-now.yml in the PUBLIC runner repo).
#
# The scheduled sync gives each store a short window every four hours, which is right for
# keeping a store up to date but far too slow for a first load: a new store is tens of
# thousands of changes. This sends continuously for up to five hours instead, so a first
# load finishes in an evening rather than over days.
#
# Manual only, and safe to run next to the scheduled sync: every store is held under its
# own lease, so whichever gets there first does the work and the other skips it.
#
# SECURITY: never add pull_request triggers, artifact uploads, caches, or steps that print
# files or environment variables. No store name is ever printed.
name: Send to Shopify now

on:
  workflow_dispatch:
    inputs:
      hours:
        description: How long to keep sending (1-5)
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3", "4", "5"]

permissions: {}

concurrency:
  group: holybackend-send-now
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Fetch private code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ayaanmotiwala/holybackend
          ref: production
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Restore environment
        shell: bash
        env:
          HOLYBACKEND_ENV: ${{ secrets.HOLYBACKEND_ENV }}
        run: |
          if [ -z "$HOLYBACKEND_ENV" ]; then echo "HOLYBACKEND_ENV secret is missing" >&2; exit 1; fi
          printf '%s\n' "$HOLYBACKEND_ENV" > .env
          chmod 600 .env
      - name: Install
        run: python -m pip install -q . > /dev/null 2>&1 || { echo "Install failed" >&2; exit 1; }
      - name: Send (output hidden)
        env:
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          HOURS: ${{ inputs.hours }}
        run: |
          python -m apps.worker.stage_runner sync \
            --shard ${{ matrix.shard }} --shards 3 \
            --budget-minutes "$(( HOURS * 60 ))" > /dev/null 2>&1 \
            || { echo "Send failed" >&2; exit 1; }
